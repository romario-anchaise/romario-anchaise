name: Actualizar avances del perfil

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_activity.py'
      - '.github/workflows/profile-activity.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Actualizar actividad pública
        run: python3 scripts/update_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar solo si hay cambios
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'docs: actualizar avances públicos'
            git push
          fi
